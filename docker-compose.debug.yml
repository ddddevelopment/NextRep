services:
  usersapi:
    image: usersapi
    build:
      context: .
      dockerfile: src/Services/Users/Users.Api/Dockerfile
      args:
        - configuration=Debug
    ports:
      - 8080:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ~/.vsdbg:/remote_debugger:rw

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: usersdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: